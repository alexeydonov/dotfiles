- defaults:
    links:
      relink: true
      create: true

- create:
  - ~/.config
  - ~/.config/mc
  - ~/.zshrc.d

- link:
    ~/:
      path: common/home/*
      glob: true
      prefix: '.'
    ~/.config:
      path: common/config/*
      glob: true
    ~/.config/mc/ini: common/config_mc_ini
    ~/.local/share:
      path: common/share/*
      glob: true

- shell:
    - command: >
        mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
        [ -f ~/.ssh/id_ed25519 ] ||
        ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "$(whoami)@$(hostname)" -q
      description: Generate SSH key if missing
