- defaults:
    links:
      relink: true
      create: true

- shell:
    - command: "./install -c common/install.conf.yaml"
      description: Run common script
    - command: >
        case "$(uname)" in
          Darwin) ./install -c macos/install.conf.yaml ;;
          Linux) ./install -c debian/install.conf.yaml ;;
        esac
      description: Run OS-specific scripts
