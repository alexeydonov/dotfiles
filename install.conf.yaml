- defaults:
    links:
      relink: true
      create: true

- create:
  - ~/.config
  - ~/.zshrc.d
  - ~/.local/share

- link:
    ~/:
      path: common/home/*
      glob: true
      prefix: '.'
    ~/.config:
      path: common/config/*
      glob: true
    ~/.local/share:
      path: common/share/*
      glob: true

- shell:
    - command: >
        mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
        [ -f ~/.ssh/id_ed25519 ] ||
        ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "$(whoami)@$(hostname)" -q
      description: Generate SSH key if missing
    - command: >
        [[ ! -d ~/.antidote ]] &&
        git clone --depth=1 https://github.com/mattmc3/antidote.git ~/.antidote
      description: Install Antidote plugin manager
