# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  auto_save.session:
    global: true
  backend:
    global: webengine
  bindings.commands:
    global:
      normal:
        <Ctrl+Shift+p>: spawn --userscript password_fill
        <Ctrl+z>: undo
        <Meta+n>: open -w
        H: scroll left
        L: scroll right
        O: cmd-set-text -s :open -w
        P: cmd-set-text -s :open --private
        d: scroll-page 0 0.5
        h: back
        l: forward
        u: scroll-page 0 -0.5
        x: tab-close
  colors.webpage.preferred_color_scheme:
    global: dark
  completion.shrink:
    global: true
  completion.use_best_match:
    global: true
  content.javascript.clipboard:
    https://github.com: access-paste
  content.notifications.enabled:
    https://meduza.io: false
  fonts.default_family:
    global: JetBrainsMono Nerd Font
  fonts.default_size:
    global: 10pt
  input.insert_mode.auto_load:
    global: false
  input.insert_mode.leave_on_load:
    global: true
  new_instance_open_target:
    global: window
  scrolling.smooth:
    global: true
  statusbar.padding:
    global:
      bottom: 4
      left: 8
      right: 8
      top: 4
  statusbar.show:
    global: in-mode
  statusbar.widgets:
    global:
    - keypress
    - search_match
    - url
    - scroll
    - history
    - tabs
    - progress
  tabs.last_close:
    global: close
  tabs.show:
    global: multiple
  tabs.tabs_are_windows:
    global: true
